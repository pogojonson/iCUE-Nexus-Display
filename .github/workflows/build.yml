name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libdbus-1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: |
          set -o pipefail
          if ! cargo test 2>&1 | tee test-output.log; then
            echo "::group::Failure details"
            grep -E "^error|FAILED|panicked at|test result:|failures:" test-output.log \
              | tail -40 | sed 's/^/::error::/'
            echo "::endgroup::"
            exit 1
          fi

      - name: Build (release)
        run: cargo build --release

      - name: Package
        run: |
          stage=icue-nexus-display-linux-x86_64
          mkdir -p "$stage"
          cp target/release/icue-nexus-display "$stage/"
          cp -r assets udev README.md "$stage/"

      - uses: actions/upload-artifact@v6
        with:
          name: icue-nexus-display-linux-x86_64
          path: icue-nexus-display-linux-x86_64/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: icue-nexus-display-linux-x86_64
          path: icue-nexus-display-linux-x86_64

      - name: Pack tarball
        run: tar -czf icue-nexus-display-linux-x86_64.tar.gz icue-nexus-display-linux-x86_64

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" icue-nexus-display-linux-x86_64.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" icue-nexus-display-linux-x86_64.tar.gz \
              --title "iCUE Nexus Display $GITHUB_REF_NAME" \
              --generate-notes
          fi
